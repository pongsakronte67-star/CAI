<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คอร์สแวร์ วิทยาการคำนวณ ป.5</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--c1:#0e9f8e;--c1d:#0a7a6d;--c2:#ff8a3d;--bg:#f2faf8;--ink:#1d2b2a;--mut:#5f7270;--line:#d5e6e3;--ok:#1f9d55;--err:#d64545;--card:#fff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:'Sarabun','Noto Sans Thai',Tahoma,sans-serif;font-size:18px;line-height:1.6;color:var(--ink);background:var(--bg)}
a{color:var(--c1d)}
h1,h2,h3{line-height:1.3;margin:.2em 0 .5em}
h2{font-size:1.5rem}
.muted{color:var(--mut)}
header.top{background:var(--c1);color:#fff;padding:.5rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header.top .brand{font-weight:700;font-size:1.1rem}
header.top nav{display:flex;gap:.25rem;flex-wrap:wrap;flex:1}
header.top nav a{color:#fff;text-decoration:none;padding:.3rem .8rem;border-radius:999px;font-size:.95rem}
header.top nav a.on,header.top nav a:hover{background:rgba(255,255,255,.25)}
.me{display:flex;align-items:center;gap:.5rem;font-size:.95rem}
.me a{color:#fff;text-decoration:none;display:flex;align-items:center;gap:.5rem}
.avatar{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--c1d);display:inline-flex;align-items:center;justify-content:center;font-weight:700;object-fit:cover;border:2px solid #fff}
.avatar.big{width:110px;height:110px;font-size:2.4rem}
main{max-width:1100px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem 1.2rem;margin:.8rem 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
.lcard{display:block;text-decoration:none;color:inherit;background:#fff;border:2px solid var(--line);border-radius:18px;padding:1rem;transition:.15s}
.lcard:hover{border-color:var(--c1);transform:translateY(-2px)}
.lcard .ic{font-size:2.2rem}
.bar{height:12px;background:#e4efed;border-radius:99px;overflow:hidden;margin:.4rem 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),#5fd3c3)}
.btn{background:var(--c1);color:#fff;border:0;border-radius:12px;padding:.5rem 1.1rem;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--c1d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--c1d);border:2px solid var(--c1)}
.btn.warn{background:var(--c2)}
.btn.danger{background:var(--err)}
.btn.sm{padding:.2rem .7rem;font-size:.9rem;border-radius:8px}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],select,textarea{width:100%;font:inherit;padding:.5rem .7rem;border:2px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--c1)}
label.f{display:block;font-weight:600;margin:.6rem 0 .2rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:.35rem 1rem;font:inherit;cursor:pointer}
.tabs button.on{background:var(--c1);color:#fff;border-color:var(--c1)}
.notice{padding:.6rem 1rem;border-radius:10px;margin:.6rem 0;background:#e8f6ff;border:1px solid #bfe2f7}
.notice.err{background:#fdeaea;border-color:#f3bcbc;color:#8b1f1f}
.notice.ok{background:#e6f7ec;border-color:#b7e3c6}
.badge{display:inline-block;border-radius:999px;padding:.05rem .7rem;font-size:.85rem;font-weight:600;background:#eee}
.badge.ok{background:#d9f4e3;color:#146c3b}.badge.wait{background:#fff0d6;color:#8a5a00}.badge.no{background:#fde0e0;color:#8b1f1f}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.login-card{max-width:440px;width:100%}
.lesson{font-size:1.1rem}
.lesson ul,.lesson ol{padding-left:1.4rem}
.lesson table{border-collapse:collapse;margin:.6rem 0;width:100%}
.lesson th,.lesson td{border:1px solid var(--line);padding:.3rem .6rem;text-align:left}
.lesson th{background:#eaf6f3}
.lesson .tip{background:#fff6e5;border-left:5px solid var(--c2);padding:.5rem .9rem;border-radius:8px;margin:.7rem 0}
.lesson .ex{background:#eef9f7;border-left:5px solid var(--c1);padding:.5rem .9rem;border-radius:8px;margin:.7rem 0}
.nav{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:1rem}
.dots{display:flex;gap:6px;margin-bottom:.4rem}
.dots i{width:28px;height:8px;border-radius:9px;background:#dbe9e6}.dots i.on{background:var(--c1)}
fieldset.q{border:2px solid var(--line);border-radius:14px;margin:.8rem 0;padding:.6rem 1rem}
fieldset.q.right{border-color:var(--ok);background:#f1fbf5}
fieldset.q.wrong{border-color:var(--err);background:#fff5f5}
fieldset.q legend{font-weight:700;padding:0 .4rem}
label.opt{display:block;padding:.25rem .3rem;cursor:pointer;border-radius:8px}
label.opt:hover{background:#f0f8f6}
label.opt input{margin-right:.5rem;transform:scale(1.2)}
.expl{margin-top:.4rem;font-size:.95rem}
.score{font-size:1.5rem;font-weight:700}
table.data{border-collapse:collapse;width:100%;font-size:.92rem}
table.data th,table.data td{border:1px solid var(--line);padding:.3rem .5rem;text-align:left;vertical-align:top}
table.data th{background:#eaf6f3;position:sticky;top:0}
.scroll{overflow:auto;max-height:70vh;border-radius:10px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:640px){.two{grid-template-columns:1fr}body{font-size:17px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#223;color:#fff;padding:.6rem 1.2rem;border-radius:12px;z-index:50;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast.err{background:var(--err)}.toast.ok{background:var(--ok)}
.loading{padding:2rem;text-align:center;color:var(--mut)}
.back{display:inline-block;margin-bottom:.4rem;text-decoration:none}
.chart{display:flex;align-items:flex-end;gap:1.2rem;height:170px;border-left:3px solid #556;border-bottom:3px solid #556;padding:0 1rem;margin:.8rem 0}
.chart div{width:70px;background:var(--c1);color:#fff;text-align:center;border-radius:6px 6px 0 0;font-weight:700}
.chart-l{display:flex;gap:1.2rem;padding:0 1rem}.chart-l span{width:70px;text-align:center;font-size:.9rem}
</style>
</head>

{key:'L3', icon:'📊', title:'ข้อมูลและการนำเสนอข้อมูล', sections:[

 {t:'ลิขสิทธิ์และการอ้างอิง', html:`

/* =====================================================================
   ตัวช่วยพื้นฐาน

const IS_CFG = !/YOUR-/.test(CFG.SUPABASE_URL + CFG.SUPABASE_ANON_KEY);
const sb = IS_CFG ? supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;
const S = { session: null, profile: null, avatarUrl: null, flash: null };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isT = () => S.profile && S.profile.role === 'teacher';
const isStudent = () => S.profile && S.profile.role === 'student';
const lessonTitle = k => { const i = LESSONS.findIndex(l => l.key === k); return i < 0 ? '-' : `บทที่ ${i+1} ${LESSONS[i].title}`; };
const fmtDate = d => d ? new Date(d).toLocaleString('th-TH', {dateStyle:'medium', timeStyle:'short'}) : '-';
const fmtDay = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('th-TH', {dateStyle:'medium'}) : '-';
const pct = p => !p ? 0 : (p.completed ? 100 : Math.round(100 * p.sections_done / p.sections_total));

async function must(p) { const r = await p; if (r.error) throw r.error; return r.data; }

function toast(msg, type = 'ok') {
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), type === 'err' ? 5000 : 2500);
}
function thaiErr(e) {
  const m = (e && e.message) || String(e);
  if (/Invalid login credentials/i.test(m)) return 'รหัสนักเรียน/อีเมล หรือรหัสผ่านไม่ถูกต้อง';
  if (/already registered/i.test(m)) return 'รหัสนี้ถูกใช้สมัครแล้ว';
  if (/at least \d+ char/i.test(m)) return 'รหัสผ่านสั้นเกินไป (อย่างน้อย 6 ตัวอักษร)';
  if (/Database error saving new user/i.test(m)) return 'สมัครไม่ได้: รหัสนี้ไม่อยู่ในรายชื่อหรือถูกใช้แล้ว';
  if (/rate limit|too many/i.test(m)) return 'ลองบ่อยเกินไป กรุณารอสักครู่';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'เชื่อมต่ออินเทอร์เน็ตไม่ได้';
  if (/row-level security|permission denied/i.test(m)) return 'ไม่มีสิทธิ์ทำรายการนี้';
  if (/exceeded the maximum|too large|Payload/i.test(m)) return 'ไฟล์ใหญ่เกินกำหนด';
  if (/mime type/i.test(m)) return 'ชนิดไฟล์นี้ไม่รองรับ';
  return m;
}
async function act(btn, fn) {
  if (btn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = 'กำลังทำงาน...'; }
  try { await fn(); } catch (e) { console.error(e); toast(thaiErr(e), 'err'); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = btn.dataset.t; } }
}
async function signed(bucket, path, secs = 3600) {
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, secs);
  if (error) throw error; return data.signedUrl;
}
async function openFile(bucket, path) {
  const w = window.open('', '_blank');
  try { const u = await signed(bucket, path, 300); if (w) w.location.href = u; else location.href = u; }
  catch (e) { if (w) w.close(); toast(thaiErr(e), 'err'); }
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-open]');
  if (a) { e.preventDefault(); openFile(a.dataset.bucket, a.dataset.open); }
});
function safeName(n) { return n.replace(/[^A-Za-z0-9._-]/g, '_').slice(-80); }
function extOf(n) { const m = /\.([A-Za-z0-9]+)$/.exec(n); return m ? m[1].toLowerCase() : ''; }
function downloadCSV(name, rows) {
  const cell = c => { c = String(c ?? ''); if (/^[=+\-@]/.test(c)) c = "'" + c; return /[",\n\r]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; };
  const csv = '\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function mediaIcon(m) {
  const t = m || '';
  return t.startsWith('image/') ? '🖼️' : t.startsWith('video/') ? '🎬' : t.startsWith('audio/') ? '🎵' : t === 'application/pdf' ? '📄' : '📎';
}
function mediaItem(m, withDel) {
  return `<div class="card row" style="justify-content:space-between"><div style="flex:1;min-width:200px">
    <b>${mediaIcon(m.mime_type)} ${esc(m.title)}</b> ${m.lesson_key ? `<span class="badge">${esc(lessonTitle(m.lesson_key))}</span>` : ''}
    <div class="muted">${esc(m.description || '')} <small>(${esc(m.file_name)})</small></div></div>
    <div class="row"><button class="btn sm" data-open="${esc(m.storage_path)}" data-bucket="media">เปิดดู</button>
    ${withDel ? `<button class="btn sm danger" data-del-media="${esc(m.id)}" data-path="${esc(m.storage_path)}">ลบ</button>` : ''}</div></div>`;
}

  <h1>🖥️ ${esc(CFG.COURSE_TITLE)}</h1><p class="muted">${esc(CFG.SCHOOL)}</p>
  ${S.flash ? `<div class="notice err">${esc(S.flash)}</div>` : ''}
  <div class="tabs" id="ltabs"><button data-t="login">เข้าสู่ระบบ</button><button data-t="reg">สมัครครั้งแรก</button><button data-t="teacher">ผู้สอน</button></div>

    <label class="f">รหัสผ่าน</label><input name="pw" type="password" autocomplete="current-password" required>

    <label class="f">รหัสนักเรียน 11 หลัก</label><input name="sid" type="text" inputmode="numeric" maxlength="11" required>

function bindLogin() {
  const tabs = [...document.querySelectorAll('#ltabs button')];
  const show = t => { tabs.forEach(b => b.classList.toggle('on', b.dataset.t === t));
    document.querySelectorAll('.pane').forEach(p => p.hidden = p.dataset.p !== t); };
  tabs.forEach(b => b.onclick = () => show(b.dataset.t)); show('login');
  document.querySelectorAll('input[name=sid]').forEach(i => i.addEventListener('input', () => { i.value = i.value.replace(/\D/g, '').slice(0, 11); }));
  const sidEmail = sid => sid + '@' + CFG.EMAIL_DOMAIN;
  const btnOf = e => e.target.querySelector('button[type=submit]');

  $('#f-login').onsubmit = e => { e.preventDefault(); const f = e.target;
    act(btnOf(e), async () => {
      const sid = f.sid.value;
      if (!/^\d{11}$/.test(sid)) throw new Error('รหัสนักเรียนต้องเป็นตัวเลข 11 หลัก');
      const { data, error } = await sb.auth.signInWithPassword({ email: sidEmail(sid), password: f.pw.value });
      if (error) throw error; S.flash = null; await onSession(data.session);
    }); };

  $('#f-reg').onsubmit = e => { e.preventDefault(); const f = e.target;
    act(btnOf(e), async () => {
      const sid = f.sid.value;
      if (!/^\d{11}$/.test(sid)) throw new Error('รหัสนักเรียนต้องเป็นตัวเลข 11 หลัก');
      if (f.pw.value.length < 6) throw new Error('รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร');
      if (f.pw.value !== f.pw2.value) throw new Error('รหัสผ่านสองครั้งไม่ตรงกัน');
      const st = await must(sb.rpc('check_student_id', { p_id: sid }));
      if (st === 'not_found') throw new Error('ไม่พบรหัสนี้ในรายชื่อรายวิชา กรุณาตรวจสอบกับครู');
      if (st === 'taken') throw new Error('รหัสนี้ถูกใช้สมัครแล้ว ถ้าลืมรหัสผ่านให้แจ้งครู');
      if (st !== 'ok') throw new Error('รหัสนักเรียนไม่ถูกต้อง');
      const { data, error } = await sb.auth.signUp({ email: sidEmail(sid), password: f.pw.value });
      if (error) throw error;
      if (!data.session) throw new Error('สมัครแล้วแต่เข้าระบบไม่ได้ (ระบบยังเปิด Confirm email) กรุณาแจ้งครู');
      S.flash = null; await onSession(data.session); toast('สมัครสำเร็จ ยินดีต้อนรับ!');
    }); };

  $('#f-teacher').onsubmit = e => { e.preventDefault(); const f = e.target;
    act(btnOf(e), async () => {
      const { data, error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.pw.value });
      if (error) throw error; S.flash = null; await onSession(data.session);
    }); };
}

async function onSession(session) {
  S.session = session; S.profile = null; S.avatarUrl = null;
  if (session) {
    const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    if (!data) {
      await sb.auth.signOut(); S.session = null;
      S.flash = 'บัญชีนี้ยังไม่ได้รับสิทธิ์ใช้งาน กรุณาแจ้งครู';
    } else {
      S.profile = data;
      if (data.avatar_path) { try { S.avatarUrl = await signed('avatars', data.avatar_path); } catch (e) { /* ไม่เป็นไร */ } }
    }
  }
  if (S.profile) { const h = location.hash; if (!h || h === '#/login') location.hash = isT() ? '#/t/summary' : '#/home'; }
  render();
}
async function logout() { await sb.auth.signOut(); S.session = null; S.profile = null; S.avatarUrl = null; location.hash = ''; render(); }

/* =====================================================================
   โครงหน้า + ตัวจัดเส้นทาง

function render() {
  const app = $('#app');
  if (!IS_CFG) { app.innerHTML = `<main><div class="notice err"><b>ยังไม่ได้ตั้งค่า</b><br>เปิดไฟล์นี้ด้วยโปรแกรมแก้ไขข้อความ แล้วแก้ SUPABASE_URL และ SUPABASE_ANON_KEY ที่ส่วนบนของสคริปต์ (ดูคู่มือขั้นที่ 5)</div></main>`; return; }
  if (!S.profile) { app.innerHTML = loginView(); bindLogin(); return; }
  const nav = isT()
    ? [['#/t/summary','📊 สรุปผล'],['#/t/grade','📝 ตรวจงาน'],['#/t/assign','📌 งานที่มอบหมาย'],['#/t/media','🎞️ สื่อการเรียน'],['#/t/roster','👥 รายชื่อ'],['#/home','📚 ดูบทเรียน']]
    : [['#/home','🏠 หน้าหลัก'],['#/assign','📝 งานของฉัน'],['#/media','🎞️ สื่อการเรียน']];
  const initial = esc((S.profile.full_name || '?').trim().charAt(0));
  app.innerHTML = `<header class="top"><span class="brand">🖥️ ${esc(CFG.COURSE_TITLE)}</span>
    <nav>${nav.map(n => `<a href="${n[0]}" data-nav="${n[0]}">${n[1]}</a>`).join('')}</nav>
    <div class="me"><a href="#/profile">${S.avatarUrl ? `<img class="avatar" src="${esc(S.avatarUrl)}" alt="">` : `<span class="avatar">${initial}</span>`}<span>${esc(S.profile.full_name)}</span></a>
    <button class="btn sm ghost" id="btn-out">ออก</button></div></header><main id="main"></main>`;
  $('#btn-out').onclick = logout;
  route();
}

let routeTok = 0;
async function route() {
  const main = $('#main'); if (!main || !S.profile) return;
  const tok = ++routeTok;
  const parts = (location.hash || '').replace(/^#\/?/, '').split('/');
  const name = parts[0] || '', t = isT();
  if (!name || (t && ['assign', 'media'].includes(name))) { location.hash = t ? '#/t/summary' : '#/home'; return; }
  if (!t && name === 't') { location.hash = '#/home'; return; }
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', location.hash === a.dataset.nav || (name === 'lesson' && a.dataset.nav === '#/home')));
  main.innerHTML = '<div class="loading">⏳ กำลังโหลด...</div>';
  const el = document.createElement('div');
  try {
    if (name === 'home') await viewHome(el);
    else if (name === 'lesson') await viewLesson(el, parts[1]);
    else if (name === 'assign') await viewAssign(el);
    else if (name === 'media') await viewMedia(el);
    else if (name === 'profile') await viewProfile(el);
    else if (name === 't' && parts[1] === 'summary') await viewTSummary(el);
    else if (name === 't' && parts[1] === 'grade') await viewTGrade(el);
    else if (name === 't' && parts[1] === 'assign') await viewTAssign(el);
    else if (name === 't' && parts[1] === 'media') await viewTMedia(el);
    else if (name === 't' && parts[1] === 'roster') await viewTRoster(el);
    else el.innerHTML = '<div class="notice err">ไม่พบหน้านี้</div>';
  } catch (e) { console.error(e); el.innerHTML = `<div class="notice err">${esc(thaiErr(e))}</div>`; }
  if (tok === routeTok) main.replaceChildren(el);
}
window.addEventListener('hashchange', () => { if (S.profile) route(); });

/* =====================================================================
   หน้าของผู้เรียน (ผู้สอนดูบทเรียนได้ด้วย)
   ===================================================================== */
async function saveProg(key, done, total) {
  if (!isStudent()) return;
  const { error } = await sb.from('progress').upsert({
    user_id: S.profile.id, lesson_key: key, sections_done: done, sections_total: total,
    completed: done >= total, updated_at: new Date().toISOString()
  }, { onConflict: 'user_id,lesson_key' });
  if (error) throw error;
}

async function viewHome(el) {
  const st = isStudent(); let prog = [], best = [], asg = [], sub = [];
  if (st) {
    const uid = S.profile.id;
    [prog, best, asg, sub] = await Promise.all([
      must(sb.from('progress').select('*').eq('user_id', uid)),
      must(sb.from('v_quiz_best').select('*').eq('user_id', uid)),
      must(sb.from('assignments').select('*').order('created_at')),
      must(sb.from('submissions').select('assignment_id,score').eq('user_id', uid))]);
  }
  const pm = Object.fromEntries(prog.map(p => [p.lesson_key, p]));
  const bm = Object.fromEntries(best.map(b => [b.lesson_key, b]));
  const avg = Math.round(LESSONS.reduce((a, l) => a + pct(pm[l.key]), 0) / LESSONS.length);
  const done = new Set(sub.map(s => s.assignment_id));
  const todo = asg.filter(a => !done.has(a.id));
  el.innerHTML = `<h2>${st ? `สวัสดี ${esc(S.profile.full_name)} 👋` : '📚 บทเรียนทั้งหมด (มุมมองผู้สอน)'}</h2>
    ${st ? `<div class="card"><b>ความก้าวหน้ารวม ${avg}%</b><div class="bar"><i style="width:${avg}%"></i></div>
      ${todo.length ? `<div class="notice">📝 มีงานที่ยังไม่ได้ส่ง ${todo.length} งาน <a href="#/assign">ไปส่งงาน</a></div>` : ''}</div>` : ''}
    <div class="grid">${LESSONS.map((l, i) => { const p = pm[l.key], b = bm[l.key]; return `
      <a class="lcard" href="#/lesson/${l.key}"><div class="ic">${l.icon}</div><b>บทที่ ${i + 1}</b><div>${esc(l.title)}</div>
      ${st ? `<div class="bar"><i style="width:${pct(p)}%"></i></div><small class="muted">เรียนแล้ว ${pct(p)}%${b ? ` · คะแนนสอบสูงสุด ${b.best_score}/${b.total}` : ' · ยังไม่ได้สอบ'}</small>` : ''}</a>`; }).join('')}</div>`;
}

async function viewLesson(el, key) {
  const idx0 = LESSONS.findIndex(l => l.key === key);
  if (idx0 < 0) { el.innerHTML = '<div class="notice err">ไม่พบบทเรียน</div>'; return; }
  const L = LESSONS[idx0], total = L.sections.length;
  let done = 0;
  if (isStudent()) {
    const p = await must(sb.from('progress').select('*').eq('user_id', S.profile.id).eq('lesson_key', key).maybeSingle());
    done = p ? p.sections_done : 0;
  }
  let idx = Math.max(0, Math.min(done - 1, total - 1));
  el.innerHTML = `<a class="back" href="#/home">← กลับหน้าหลัก</a><h2>${L.icon} บทที่ ${idx0 + 1}: ${esc(L.title)}</h2>
    <div class="tabs" id="ltab"><button data-t="c">📖 เนื้อหา</button><button data-t="m">🎞️ สื่อการเรียน</button><button data-t="q">✏️ แบบทดสอบ</button></div>
    <div id="tc"></div><div id="tm" hidden></div><div id="tq" hidden></div>`;
  const tc = $('#tc', el), tm = $('#tm', el), tq = $('#tq', el);
  const loaded = { m: false, q: false };
  function tab(t) {
    el.querySelectorAll('#ltab button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    tc.hidden = t !== 'c'; tm.hidden = t !== 'm'; tq.hidden = t !== 'q';
    if (t === 'm' && !loaded.m) { loaded.m = true; loadMedia(); }
    if (t === 'q' && !loaded.q) { loaded.q = true; loadQuiz(tq, key); }
  }
  el.querySelectorAll('#ltab button').forEach(b => b.onclick = () => tab(b.dataset.t));
  function step() {
    const s = L.sections[idx];
    tc.innerHTML = `<div class="card"><div class="dots">${L.sections.map((_, i) => `<i class="${i <= idx ? 'on' : ''}"></i>`).join('')}</div>
      <h3>${esc(s.t)}</h3><div class="lesson">${s.html}</div>
      <div class="nav"><button class="btn ghost" id="prev" ${idx === 0 ? 'disabled' : ''}>◀ ก่อนหน้า</button><span>${idx + 1} / ${total}</span>
      <button class="btn" id="next">${idx === total - 1 ? 'ไปทำแบบทดสอบ ▶' : 'ถัดไป ▶'}</button></div></div>`;
    if (idx + 1 > done) { done = idx + 1; saveProg(key, done, total).catch(e => toast(thaiErr(e), 'err')); }
    $('#prev', tc).onclick = () => { idx--; step(); };
    $('#next', tc).onclick = () => { if (idx === total - 1) { tab('q'); } else { idx++; step(); window.scrollTo(0, 0); } };
  }
  async function loadMedia() {
    tm.innerHTML = '<div class="loading">⏳</div>';
    try {
      const rows = await must(sb.from('media').select('*').eq('lesson_key', key).order('created_at'));
      tm.innerHTML = rows.length ? rows.map(m => mediaItem(m, false)).join('') : '<p class="muted">บทนี้ยังไม่มีสื่อเพิ่มเติม</p>';
    } catch (e) { tm.innerHTML = `<div class="notice err">${esc(thaiErr(e))}</div>`; }
  }
  step(); tab('c');
}

async function loadQuiz(box, key) {
  box.innerHTML = '<div class="loading">⏳</div>';
  let qs;
  try { qs = await must(sb.rpc('get_quiz', { p_lesson: key })); }
  catch (e) { box.innerHTML = `<div class="notice err">${esc(thaiErr(e))}</div>`; return; }
  if (!qs.length) { box.innerHTML = '<p class="muted">บทนี้ยังไม่มีข้อสอบ</p>'; return; }
  box.innerHTML = `<div class="card"><p class="muted">ตอบให้ครบทุกข้อ แล้วกด "ส่งคำตอบ" ${isStudent() ? '(ทำซ้ำได้ ระบบเก็บคะแนนสูงสุด)' : '(ผู้สอนทดลองทำได้ ไม่บันทึกคะแนน)'}</p>
    ${qs.map((q, i) => `<fieldset class="q" data-i="${i}"><legend>${i + 1}. ${esc(q.question)}</legend>
      ${q.choices.map((c, j) => `<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${esc(c)}</label>`).join('')}
      <div class="expl" hidden></div></fieldset>`).join('')}
    <p><button class="btn" id="qsub">ส่งคำตอบ</button></p><div id="qres"></div></div>`;
  $('#qsub', box).onclick = ev => act(ev.target, async () => {
    const ans = qs.map((_, i) => { const r = box.querySelector(`input[name=q${i}]:checked`); return r ? Number(r.value) : -1; });
    if (ans.includes(-1)) throw new Error('กรุณาตอบให้ครบทุกข้อก่อนส่ง');
    const res = await must(sb.rpc('submit_quiz', { p_lesson: key, p_answers: ans }));
    res.results.forEach((r, i) => {
      const fs = box.querySelector(`fieldset[data-i="${i}"]`);
      fs.classList.add(r.correct ? 'right' : 'wrong');
      fs.querySelectorAll('input').forEach(x => x.disabled = true);
      const ex = fs.querySelector('.expl'); ex.hidden = false;
      ex.innerHTML = (r.correct ? '✅ ถูกต้อง' : `❌ ยังไม่ถูก เฉลย: ข้อ ${r.correct_index + 1}`) + (r.explanation ? ' — ' + esc(r.explanation) : '');
    });
    $('#qres', box).innerHTML = `<div class="notice ${res.score === res.total ? 'ok' : ''}"><span class="score">ได้ ${res.score} / ${res.total} คะแนน</span> ${res.score === res.total ? '🎉 เก่งมาก!' : 'ลองทบทวนเนื้อหาแล้วทำใหม่ได้'}
      ${res.saved ? '' : '<br><small>(โหมดผู้สอน ไม่บันทึกคะแนน)</small>'}<p><button class="btn ghost" id="qretry">ทำใหม่</button></p></div>`;
    $('#qsub', box).hidden = true;
    $('#qretry', box).onclick = () => loadQuiz(box, key);
  });
}

async function viewTSummary(el) {
  const [roster, prog, qb, asg, sub] = await Promise.all([

    must(sb.from('progress').select('*')),
    must(sb.from('v_quiz_best').select('*')),
    must(sb.from('assignments').select('*').order('created_at')),
    must(sb.from('submissions').select('assignment_id,user_id,score'))]);
  const classes = [...new Set(roster.map(r => r.class_room).filter(Boolean))].sort();
  const head = ['รหัสนักเรียน', 'ชื่อ-สกุล', 'ห้อง', 'สถานะสมัคร', 'ความก้าวหน้าเฉลี่ย (%)',
    ...LESSONS.map((l, i) => `คะแนนสอบ บทที่ ${i + 1}`), 'ส่งงาน (ชิ้น)', 'คะแนนงานที่ตรวจแล้ว', 'คะแนนเต็มงานที่ตรวจแล้ว'];
  const maxOf = Object.fromEntries(asg.map(a => [a.id, a.max_score]));
  function build(cls) {
    return roster.filter(r => !cls || r.class_room === cls).map(r => {
      const u = r.claimed_by;
      if (!u) return [r.student_id, r.full_name, r.class_room || '', 'ยังไม่สมัคร', '', ...LESSONS.map(() => ''), '', '', ''];
      const avg = Math.round(LESSONS.reduce((a, l) => a + pct(prog.find(p => p.user_id === u && p.lesson_key === l.key)), 0) / LESSONS.length);
      const sc = LESSONS.map(l => { const b = qb.find(x => x.user_id === u && x.lesson_key === l.key); return b ? `${b.best_score}/${b.total}` : '-'; });
      const mine = sub.filter(s => s.user_id === u), gr = mine.filter(s => s.score !== null);
      return [r.student_id, r.full_name, r.class_room || '', 'สมัครแล้ว', avg, ...sc, `${mine.length}/${asg.length}`,
        gr.reduce((a, s) => a + s.score, 0), gr.reduce((a, s) => a + (maxOf[s.assignment_id] || 0), 0)];
    });
  }
  el.innerHTML = `<h2>📊 สรุปผลผู้เรียน</h2><div class="card row">
    <label>ห้อง: <select id="cls" style="width:auto"><option value="">ทั้งหมด</option>${classes.map(c => `<option>${esc(c)}</option>`).join('')}</select></label>
    <button class="btn" id="csv">⬇️ ส่งออก CSV</button><span class="muted" id="cnt"></span></div>
    <div class="scroll"><table class="data" id="tb"></table></div>`;
  const draw = () => { const rows = build($('#cls', el).value);
    $('#tb', el).innerHTML = `<tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr>` + rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    $('#cnt', el).textContent = `${rows.length} คน`; return rows; };
  $('#cls', el).onchange = draw; draw();
  $('#csv', el).onclick = () => downloadCSV(`สรุปผล_${new Date().toISOString().slice(0, 10)}.csv`, [head, ...build($('#cls', el).value)]);
}

function parseRoster(txt) {
  const map = new Map(), bad = [];
  txt.replace(/^\ufeff/, '').split(/\r?\n/).forEach((ln, i) => {
    if (!ln.trim()) return;
    const c = ln.split(/[,\t]/).map(x => x.trim());
    if (i === 0 && !/^\d+$/.test(c[0])) return;            // ข้ามบรรทัดหัวตาราง
    if (!/^\d{11}$/.test(c[0] || '')) { bad.push(`บรรทัด ${i + 1}: รหัสต้องเป็นตัวเลข 11 หลัก`); return; }
    if (!c[1]) { bad.push(`บรรทัด ${i + 1}: ไม่มีชื่อ`); return; }
    map.set(c[0], { student_id: c[0], full_name: c[1], class_room: c[2] || null });
  });
  return { rows: [...map.values()], bad };
}

  const roster = await must(sb.from('roster').select('*').order('student_id'));
  el.innerHTML = `<h2>👥 รายชื่อรายวิชา</h2><div class="card"><h3>นำเข้า/อัปเดตรายชื่อ</h3>
    <p class="muted">วางข้อมูลทีละบรรทัด รูปแบบ: <code>รหัส 11 หลัก, ชื่อ-สกุล, ห้อง</code> (คัดลอกจาก Excel มาวางได้) ถ้ารหัสมีอยู่แล้วจะอัปเดตชื่อและห้อง</p>
    <textarea id="rt" rows="6" placeholder="12345678901, ด.ช.สมชาย ใจดี, ป.5/1"></textarea>
    <p><button class="btn" id="rimp">นำเข้า</button></p><div id="rmsg"></div></div>
    <div class="card"><b>ทั้งหมด ${roster.length} คน · สมัครแล้ว ${roster.filter(r => r.claimed_by).length} คน</b>
    <div class="scroll"><table class="data"><tr><th>รหัส</th><th>ชื่อ-สกุล</th><th>ห้อง</th><th>สถานะ</th><th>จัดการ</th></tr>
    ${roster.map(r => `<tr><td>${esc(r.student_id)}</td><td>${esc(r.full_name)}</td><td>${esc(r.class_room || '')}</td>
      <td>${r.claimed_by ? '<span class="badge ok">สมัครแล้ว</span>' : '<span class="badge">ยังไม่สมัคร</span>'}</td>
      <td>${r.claimed_by ? `<button class="btn sm warn" data-rp="${esc(r.student_id)}">รีเซ็ตรหัสผ่าน</button> <button class="btn sm danger" data-rel="${esc(r.student_id)}">ปล่อยรหัส</button>`
        : `<button class="btn sm danger" data-rm="${esc(r.student_id)}">ลบ</button>`}</td></tr>`).join('')}</table></div></div>`;
  $('#rimp', el).onclick = e => act(e.target, async () => {
    const { rows, bad } = parseRoster($('#rt', el).value);
    $('#rmsg', el).innerHTML = bad.length ? `<div class="notice err">${bad.map(esc).join('<br>')}</div>` : '';
    if (!rows.length) throw new Error('ไม่พบข้อมูลที่นำเข้าได้');
    const r = await sb.from('roster').upsert(rows, { onConflict: 'student_id' }); if (r.error) throw r.error;
    toast(`นำเข้า ${rows.length} รายการ` + (bad.length ? ` (ข้าม ${bad.length})` : '')); if (!bad.length) route();
  });
  el.querySelectorAll('[data-rp]').forEach(b => b.onclick = () => act(b, async () => {
    const pw = prompt('ตั้งรหัสผ่านใหม่ให้นักเรียนรหัส ' + b.dataset.rp + ' (อย่างน้อย 6 ตัวอักษร)'); if (!pw) return;
    await must(sb.rpc('reset_student_password', { p_student_id: b.dataset.rp, p_new: pw })); toast('รีเซ็ตรหัสผ่านแล้ว'); }));
  el.querySelectorAll('[data-rel]').forEach(b => b.onclick = () => act(b, async () => {
    if (!confirm('ปล่อยรหัส ' + b.dataset.rel + '?\nบัญชีและข้อมูลทั้งหมดของนักเรียนคนนี้ (ความก้าวหน้า คะแนน งานที่ส่ง) จะถูกลบถาวร เพื่อให้สมัครใหม่ได้')) return;
    await must(sb.rpc('release_student', { p_student_id: b.dataset.rel })); toast('ปล่อยรหัสแล้ว'); route(); }));
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => act(b, async () => {
    if (!confirm('ลบรหัส ' + b.dataset.rm + ' ออกจากรายชื่อ?')) return;
    const r = await sb.from('roster').delete().eq('student_id', b.dataset.rm); if (r.error) throw r.error; toast('ลบแล้ว'); route(); }));
}

/* =====================================================================
   เริ่มทำงาน
   ===================================================================== */
(async function boot() {
  if (!IS_CFG) { render(); return; }
  try {
    const { data } = await sb.auth.getSession();
    await onSession(data.session);
  } catch (e) { console.error(e); $('#app').innerHTML = `<main><div class="notice err">${esc(thaiErr(e))}</div></main>`; }
})();
</script>
</body>
